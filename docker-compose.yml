services:
  socks5:
    image: tarampampam/3proxy:latest
    container_name: socks5-proxy
    restart: unless-stopped
    ports:
      - "1080:1080"
    volumes:
      # Конфиг монтируем read-only — содержит пароль, ничего внутри менять не нужно
      - ./3proxy.cfg:/etc/3proxy/3proxy.cfg:ro
    environment:
      - TZ=Europe/Moscow
    # Лимиты ресурсов через mem_limit/cpus, т.к. `deploy.resources` работает
    # только в Swarm-режиме, а не в обычном `docker compose up`.
    mem_limit: 64m
    cpus: 0.2
